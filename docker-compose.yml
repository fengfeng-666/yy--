services:
  postgres:
    image: postgres:16
    container_name: yy-kitchen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yy_kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yy_kitchen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: yy-kitchen-chroma
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
    container_name: yy-kitchen-backend
    environment:
      APP_NAME: YY私厨
      APP_ENV: development
      DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-yy_kitchen}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_SECRET_KEY: replace-with-strong-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: 10
      CORS_ORIGINS: '["http://localhost:5174"]'
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mimo-v2.5}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_VECTOR_BACKEND: ${AI_VECTOR_BACKEND:-chroma}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-data/chroma}
      PGVECTOR_TABLE_PREFIX: ${PGVECTOR_TABLE_PREFIX:-yy_ai}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.1}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  chroma_data:
