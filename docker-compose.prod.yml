services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: "${WEB_DOMAIN:?WEB_DOMAIN is required}"
      ROOT_DOMAIN: "${ROOT_DOMAIN:?ROOT_DOMAIN is required}"
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN is required}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-YY私厨}"
      APP_ENV: production
      DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:?POSTGRES_DB is required}"
      DB_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-10}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      AI_ENABLED: "${AI_ENABLED:-true}"
      AI_BASE_URL: "${AI_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-REMOVED_AI_API_KEY}"
      AI_MODEL: "${AI_MODEL:-mimo-v2.5}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-text-embedding-3-small}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-60}"
      AI_MAX_HISTORY_MESSAGES: "${AI_MAX_HISTORY_MESSAGES:-12}"
      AI_VECTOR_BACKEND: "${AI_VECTOR_BACKEND:-chroma}"
      CHROMA_PERSIST_DIR: "${CHROMA_PERSIST_DIR:-data/chroma}"
      RAG_TOP_K: "${RAG_TOP_K:-4}"
      RAG_SCORE_THRESHOLD: "${RAG_SCORE_THRESHOLD:-0.1}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_TEMPLATE_NEW_ORDER: "${WECHAT_TEMPLATE_NEW_ORDER:-}"
      WECHAT_TEMPLATE_ORDER_ACCEPTED: "${WECHAT_TEMPLATE_ORDER_ACCEPTED:-}"
      WECHAT_ENABLED: "${WECHAT_ENABLED:-false}"
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8001
        --workers $${UVICORN_WORKERS:-2} --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health'));
          assert data['data']['status'] == 'ok'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
