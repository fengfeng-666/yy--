[project]
name = "yy-kitchen-backend"
version = "0.1.0"
description = "YY私厨 FastAPI backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.4,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.116.1,<1.0.0",
    "greenlet>=3.2.3,<4.0.0",
    "PyJWT>=2.10.1,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "sqlalchemy>=2.0.42,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.4,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
